<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W-82 酒查詢系統</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green-dark:#3a5438;--green-mid:#5a7a56;--green-light:#8aaa86;
  --green-pale:#ddeedd;--green-bg:#f2f5f2;--gold:#8a7248;
  --text:#222;--text-sub:#666;--white:#fff;--border:#c8d8c4;
  --radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.09);
}
body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--green-bg);color:var(--text);min-height:100vh}

header{background:var(--green-dark);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
header h1{color:#fff;font-size:20px;font-weight:700;letter-spacing:2px}
.back-btn{display:none;color:#fff;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:6px 16px;font-size:14px;cursor:pointer;font-family:inherit}

.page{display:none;padding:24px 28px}
.page.active{display:block}

/* ── Home ── */
.home-title{text-align:center;color:var(--green-dark);font-size:14px;font-weight:600;letter-spacing:2px;margin-bottom:24px;opacity:0.7}
.client-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-auto-rows:1fr}
.client-tile{background:var(--green-dark);border-radius:var(--radius);padding:36px 12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform 0.15s,background 0.15s}
.client-tile:hover{transform:translateY(-3px);background:#4a6a48}
.client-tile.other{background:var(--gold)}
.client-tile.other:hover{background:#9a8258}
.client-tile .name{color:#fff;font-size:24px;font-weight:800;letter-spacing:2px}
.client-tile .sub{color:rgba(255,255,255,0.6);font-size:11px;margin-top:6px}

/* ── Client page ── */
.page-title{font-size:30px;font-weight:800;color:var(--green-dark);margin-bottom:20px;letter-spacing:2px}

.search-row{background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;gap:12px;align-items:flex-end;margin-bottom:20px}
.sf{display:flex;flex-direction:column;gap:5px;flex:1}
.sf label{font-size:12px;font-weight:700;color:var(--green-dark)}
.sf input{border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:15px;font-family:inherit;outline:none;background:var(--green-bg);transition:border-color 0.15s}
.sf input:focus{border-color:var(--green-mid);background:#fff}
.btn-search{background:var(--green-dark);color:#fff;border:none;border-radius:8px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-search:hover{background:var(--green-mid)}

/* List */
.list-status{font-size:13px;color:var(--text-sub);margin-bottom:8px;padding:0 2px}
.list-table{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;display:block;width:100%}
.list-row-wrap{border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;display:block;width:100%}
.list-row-wrap:last-child{border-bottom:none}
.list-row-wrap:nth-child(odd){background:#f8fbf8}
.list-row-wrap:nth-child(even){background:#fff}
.list-row-wrap:hover{background:var(--green-pale)}
.list-row{display:grid !important;grid-template-columns:140px 1fr 130px;width:100%}
.list-summary{padding:8px 16px 12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--border)}
.sum-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sum-lbl{font-size:11px;color:var(--text-sub);font-weight:700;white-space:nowrap}
.sum-tag{background:#e8f0e8;color:var(--green-dark);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.sum-tag-blue{background:#e8eef8;color:#3a4a8a}
.sum-tag-red{background:#fde8e8;color:#c0392b;font-weight:800}
.list-head{display:grid !important;grid-template-columns:140px 1fr 130px;background:var(--green-dark);color:#fff;font-size:15px;font-weight:700;width:100%}
.list-head .th{padding:14px 16px;border-right:1px solid rgba(255,255,255,0.15)}
.list-head .th:last-child{border-right:none}

.list-row .td{padding:16px 16px;font-size:16px;border-right:1px solid var(--border);display:flex;align-items:center}
.list-row .td:last-child{border-right:none}
.tracking-link{color:var(--green-dark);font-weight:700;font-size:16px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tracking-link:hover{color:var(--green-mid)}
.dot-shipped{width:9px;height:9px;border-radius:50%;background:#4caf50;display:inline-block;margin-right:8px;flex-shrink:0}
.dot-pending{width:9px;height:9px;border-radius:50%;background:#ccc;display:inline-block;margin-right:8px;flex-shrink:0}

/* ── Tracking detail page ── */
.tracking-header{margin-bottom:20px}
.tracking-client-tag{font-size:14px;color:var(--green-light);font-weight:600;letter-spacing:1px;margin-bottom:6px}
.tracking-number{font-size:26px;font-weight:800;color:var(--green-dark);margin-bottom:4px;letter-spacing:1px}

/* Box cards */
.box-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;padding:0 24px}
.box-card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.box-card-header{background:var(--green-dark);padding:22px 24px;display:flex;align-items:center;gap:20px}
.box-card-header .ship-box-label{color:rgba(255,255,255,0.6);font-size:15px;margin-bottom:4px}
.box-card-header .ship-box-big{color:#fff;font-size:38px;font-weight:800;letter-spacing:2px;margin-bottom:4px}
.box-card-header .box-id-num{color:rgba(255,255,255,0.7);font-size:18px}
.tracking-red{color:#c0392b !important;font-weight:700}
.box-card-header .status-badge{margin-left:auto;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.badge-shipped{background:#4caf50;color:#fff}
.badge-pending{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.7)}

.box-card-ship{padding:20px 24px;background:#f5faf5;border-bottom:1px solid var(--border);display:flex;gap:36px;flex-wrap:wrap}
.ship-f{display:flex;flex-direction:column;gap:2px}
.ship-fl{font-size:14px;color:var(--text-sub);font-weight:600;letter-spacing:0.5px}
.ship-fv{font-size:22px;font-weight:700;color:var(--green-dark)}
.ship-fv.empty{color:#ccc;font-weight:400;font-size:18px}

.box-card-detail{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.df{display:flex;flex-direction:column;gap:2px}
.dl{font-size:14px;color:var(--text-sub);font-weight:600;letter-spacing:0.5px}
.dv{font-size:22px;font-weight:600;color:var(--text)}
.dv.empty{color:#ccc;font-weight:400;font-size:18px}

/* Empty / Loading */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-sub)}
.empty-state .icon{font-size:44px;margin-bottom:10px}
.empty-state p{font-size:15px}
.loading-state{text-align:center;padding:40px 20px;color:var(--green-mid)}
.spinner{width:32px;height:32px;border:3px solid var(--green-pale);border-top-color:var(--green-dark);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .client-grid{grid-template-columns:repeat(2,1fr)}
  .search-row{flex-wrap:wrap}
  .btn-search{width:100%}
  .list-head,.list-row{grid-template-columns:110px 1fr 100px}
  .box-card-detail{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <h1>🍶 W-82 酒查詢</h1>
  <button class="back-btn" id="back-btn" onclick="goBack()">← 返回</button>
</header>

<!-- Page: Home -->
<div class="page active" id="page-home">
  <div class="home-title">選擇客戶</div>
  <div class="client-grid">
    <div class="client-tile" onclick="openClient('C-44')"><div class="name">C-44</div></div>
    <div class="client-tile" onclick="openClient('W-35')"><div class="name">W-35</div></div>
    <div class="client-tile" onclick="openClient('D-13')"><div class="name">D-13</div></div>
    <div class="client-tile" onclick="openClient('SL-2')"><div class="name">SL-2</div></div>
    <div class="client-tile" onclick="openClient('C-46')"><div class="name">C-46</div></div>
    <div class="client-tile" onclick="openClient('T-6')"><div class="name">T-6</div></div>
    <div class="client-tile" onclick="openClient('H-86')"><div class="name">H-86</div></div>
    <div class="client-tile other" onclick="openOther()">
      <div class="name">其他</div>
      <div class="sub">自行輸入客戶編號</div>
    </div>
  </div>
</div>

<!-- Page: Client -->
<div class="page" id="page-client">
  <div class="page-title" id="client-title"></div>
  <div class="search-row">
    <div class="sf">
      <label>宅配編號</label>
      <input type="text" id="f-tracking" placeholder="輸入宅配編號搜尋..." />
    </div>
    <button class="btn-search" onclick="doSearch()">🔍 搜尋</button>
  </div>
  <div class="list-status" id="list-status"></div>
  <div class="list-table">
    <div class="list-head">
      <div class="th">日期</div>
      <div class="th">宅配編號</div>
      <div class="th">回台箱號</div>
    </div>
    <div id="list-body">
      <div class="empty-state"><div class="icon">🔍</div><p>輸入宅配編號或直接搜尋全部</p></div>
    </div>
  </div>
</div>

<!-- Page: Tracking Detail -->
<div class="page" id="page-tracking">
  <div class="tracking-header">
    <div class="tracking-client-tag" id="detail-client"></div>
    <div class="tracking-number" id="detail-tracking"></div>
  </div>
  <div class="box-cards" id="box-cards"></div>
</div>

<script>
let currentClient = '';
let currentPage = 'home';
let allRows = [];

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('back-btn').style.display = page !== 'home' ? 'block' : 'none';
  currentPage = page;
  window.scrollTo(0, 0);
}

function goBack() {
  if (currentPage === 'tracking') showPage('client');
  else showPage('home');
}

function openClient(name) {
  currentClient = name;
  document.getElementById('client-title').textContent = name;
  document.getElementById('f-tracking').value = '';
  document.getElementById('list-status').textContent = '';
  document.getElementById('list-body').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>輸入宅配編號或直接搜尋全部</p></div>';
  showPage('client');
  doSearch();
}

function openOther() {
  const name = prompt('請輸入客戶編號：');
  if (name && name.trim()) openClient(name.trim());
}

async function doSearch() {
  const tracking = document.getElementById('f-tracking').value.trim();
  const isInitial = !tracking && allRows.length === 0;

  document.getElementById('list-body').innerHTML = '<div class="loading-state"><div class="spinner"></div><p>查詢中...</p></div>';
  document.getElementById('list-status').textContent = '';

  try {
    const res = await fetch('/api/notion', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ client: currentClient, tracking }),
    });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    allRows = data.rows || [];
    renderList(!!tracking);  // 有輸入搜尋條件才顯示摘要
  } catch(e) {
    showError(e.message);
  }
}

function showError(msg) {
  document.getElementById('list-body').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${msg}</p></div>`;
}

function renderList(showSummary = false) {
  const body = document.getElementById('list-body');
  const status = document.getElementById('list-status');

  if (!allRows.length) {
    status.textContent = '找不到符合的資料';
    body.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>找不到符合的資料</p></div>';
    return;
  }

  const grouped = {};
  for (const r of allRows) {
    const key = r.tracking || '(無宅配編號)';
    if (!grouped[key]) grouped[key] = { tracking: key, dates: new Set(), ship_boxes: new Set(), shipped: false };
    if (r.ship_date) grouped[key].dates.add(r.ship_date);
    if (r.ship_box) grouped[key].ship_boxes.add(r.ship_box);
    if (r.ship_box || r.ship_date) grouped[key].shipped = true;
  }

  const groups = Object.values(grouped);
  // 依最新日期降序排列
  groups.sort((a, b) => {
    const da = [...a.dates].sort().reverse()[0] || '';
    const db = [...b.dates].sort().reverse()[0] || '';
    return db.localeCompare(da);
  });
  status.textContent = `共 ${groups.length} 筆宅配`;

  body.innerHTML = groups.map(g => {
    const dot = g.shipped ? '<span class="dot-shipped"></span>' : '<span class="dot-pending"></span>';
    const dates = [...g.dates].sort().reverse()[0] || '—';
    const boxes = [...g.ship_boxes].join('、') || '—';

    let summaryHtml = '';
    if (showSummary) {
      const gRows = allRows.filter(r => r.tracking === g.tracking);
      const capMap = {};
      let totalBox = 0;
      const boxIds = new Set();
      for (const r of gRows) {
        const cap = r.capacity ? r.capacity + 'ml' : '未知';
        const qty = parseInt(r.qty) || 0;
        capMap[cap] = (capMap[cap] || 0) + qty;
        totalBox += parseInt(r.box_type) || 0;
        if (r.box_id) boxIds.add(r.box_id);
      }
      const totalQty = Object.values(capMap).reduce((a,b)=>a+b,0);
      const capStr = Object.entries(capMap)
        .filter(([k]) => k !== '未知')
        .sort((a,b) => parseInt(a[0]) - parseInt(b[0]))
        .map(([cap, qty]) => `<span class="sum-tag">${cap} × ${qty}瓶</span>`).join('');
      const boxIdStr = [...boxIds].map(id => `<span class="sum-tag sum-tag-blue">${id}</span>`).join('');
      summaryHtml = `<div class="list-summary">
        <div class="sum-group"><span class="sum-lbl">總瓶數</span><span class="sum-tag sum-tag-red">${totalQty} 瓶</span></div>
        <div class="sum-group"><span class="sum-lbl">容量／數量</span>${capStr || '—'}</div>
        <div class="sum-group"><span class="sum-lbl">酒盒</span><span class="sum-tag">${totalBox} 個</span></div>
        <div class="sum-group"><span class="sum-lbl">酒箱號</span>${boxIdStr || '—'}</div>
      </div>`;
    }

    return `<div class="list-row-wrap" onclick="openTracking('${encodeURIComponent(g.tracking)}')">
      <div class="list-row">
        <div class="td">${dates}</div>
        <div class="td"><span class="tracking-link">${dot}${g.tracking}</span></div>
        <div class="td">${boxes}</div>
      </div>
      ${summaryHtml}
    </div>`;
  }).join('');
}

async function openTracking(encodedTracking) {
  const tracking = decodeURIComponent(encodedTracking);

  document.getElementById('detail-client').textContent = currentClient;
  document.getElementById('detail-tracking').textContent = tracking;
  document.getElementById('box-cards').innerHTML = '<div class="loading-state"><div class="spinner"></div><p>載入中...</p></div>';
  showPage('tracking');

  // Step 1: 找出這個宅配編號的所有酒箱號
  const relatedBoxIds = [...new Set(
    allRows.filter(r => r.tracking === tracking).map(r => r.box_id).filter(Boolean)
  )];

  // Step 2: 對每個酒箱號去 Notion 補查完整資料
  let fullItems = [];
  try {
    for (const boxId of relatedBoxIds) {
      const res = await fetch('/api/notion', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ client: currentClient, box_id: boxId }),
      });
      const data = await res.json();
      if (data.rows) fullItems = fullItems.concat(data.rows);
    }
  } catch(e) {
    document.getElementById('box-cards').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
    return;
  }

  if (!fullItems.length) {
    document.getElementById('box-cards').innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>找不到資料</p></div>';
    return;
  }

  // 依酒箱編號分組
  const byBox = {};
  for (const r of fullItems) {
    const boxId = r.box_id || '(未知)';
    if (!byBox[boxId]) byBox[boxId] = [];
    byBox[boxId].push(r);
  }

  const cards = Object.entries(byBox).map(([boxId, rows]) => {
    const first = rows[0];
    const shipped = first.ship_box || first.ship_date;
    const badge = shipped
      ? '<span class="status-badge badge-shipped">✔ 已回台</span>'
      : '<span class="status-badge badge-pending">⏳ 未回台</span>';

    const details = rows.map(r => `
      <div class="box-card-detail">
        <div class="df"><span class="dl">宅配業者</span><span class="dv ${r.carrier?'':'empty'}">${r.carrier||'—'}</span></div>
        <div class="df"><span class="dl">宅配編號</span><span class="dv ${r.tracking===tracking?'tracking-red':''} ${r.tracking?'':'empty'}">${r.tracking||'—'}</span></div>
        <div class="df"><span class="dl">容量</span><span class="dv ${r.capacity?'':'empty'}">${r.capacity ? r.capacity+'ml' : '—'}</span></div>
        <div class="df"><span class="dl">數量</span><span class="dv ${r.qty?'':'empty'}">${r.qty ? r.qty+'瓶' : '—'}</span></div>
        <div class="df"><span class="dl">酒商</span><span class="dv ${r.merchant?'':'empty'}">${r.merchant||'—'}</span></div>
        <div class="df"><span class="dl">酒標</span><span class="dv ${r.label?'':'empty'}">${r.label||'—'}</span></div>
        <div class="df"><span class="dl">酒盒</span><span class="dv ${r.box_type?'':'empty'}">${r.box_type||'—'}</span></div>
      </div>`).join('<hr style="border:none;border-top:1px solid var(--border);margin:0">');

    return `<div class="box-card">
      <div class="box-card-header">
        <div>
          <div class="ship-box-label">回台箱號</div>
          <div class="ship-box-big">${first.ship_box || '—'}</div>
          <div class="box-id-num"># ${boxId}</div>
        </div>
        ${badge}
      </div>
      <div class="box-card-ship">
        <div class="ship-f"><span class="ship-fl">回台日期</span><span class="ship-fv ${first.ship_date?'':'empty'}">${first.ship_date||'—'}</span></div>
        <div class="ship-f"><span class="ship-fl">回台箱號</span><span class="ship-fv ${first.ship_box?'':'empty'}">${first.ship_box||'—'}</span></div>
        <div class="ship-f"><span class="ship-fl">酒箱號</span><span class="ship-fv">${boxId}</span></div>
      </div>
      ${details}
    </div>`;
  }).join('');

  document.getElementById('box-cards').innerHTML = cards;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && currentPage === 'client') doSearch();
});

showPage('home');
</script>
</body>
</html>
